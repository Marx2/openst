services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openst
      POSTGRES_PASSWORD: openst
      POSTGRES_DB: openst
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openst -d openst"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    env_file:
      - path: .env
        required: false

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://openst:openst@postgres:5432/openst
    env_file:
      - path: .env
        required: false
