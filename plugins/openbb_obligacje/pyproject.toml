[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "openbb-obligacje"
version = "0.1.0"
description = "obligacjeskarbowe.pl OpenBB provider — Polish retail savings bonds (OTS/ROR/DOR/TOS/COI/ROS/EDO/ROD)"
dependencies = ["openbb-core"]

[project.entry-points."openbb_provider_extension"]
obligacje = "openbb_obligacje:obligacje_provider"